name: TgWsProxy
options:
  bundleIdPrefix: com.vibecoderqin
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TgWsProxy:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecoderqin.tgwsproxy
        PRODUCT_NAME: TgWsProxy
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/TgWsProxy-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/Libs"]
        OTHER_LDFLAGS: ["-ltg_ws_proxy_ios", "-lresolv", "-liconv", "-framework", "Security"]
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "TG WS Proxy"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
